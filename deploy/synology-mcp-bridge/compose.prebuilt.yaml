services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/homeassistant:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  xiaozhi-mcp-bridge:
    image: local/xiaozhi-mcp-bridge:0.1.4
    container_name: xiaozhi-mcp-bridge
    restart: unless-stopped
    network_mode: host
    env_file:
      - bridge.env
    depends_on:
      - homeassistant
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
