name: Build Verified Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bread-compact-wifi:
    name: Build bread-compact-wifi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build verified ESP32-S3 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py bread-compact-wifi --name bread-compact-wifi

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-wifi_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
